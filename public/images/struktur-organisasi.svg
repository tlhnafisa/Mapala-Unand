<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#090d13; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131b"/>
      <stop offset="50%" stop-color="#080b0f"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#0f141d"/>
    </linearGradient>
    <linearGradient id="ketuaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2230"/>
      <stop offset="100%" stop-color="#111722"/>
    </linearGradient>
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#FF5E14" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  
  <!-- Subtle Decorative Grid Lines -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1300" y1="0" x2="1300" y2="900"/>
    <line x1="1500" y1="0" x2="1500" y2="900"/>
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="350" x2="1600" y2="350"/>
    <line x1="0" y1="550" x2="1600" y2="550"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
  </g>

  <!-- Top Header Banner -->
  <g transform="translate(80, 50)">
    <!-- Logo Box -->
    <rect x="0" y="0" width="70" height="70" rx="12" fill="#FF5E14"/>
    <g transform="translate(10, 10) scale(0.5)">
      <!-- Stylized rope symbol -->
      <path d="M12 25 L35 25 A15 15 0 0 1 50 40 L50 60 A15 15 0 0 0 65 75 L88 75" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
      <rect x="0" y="0" width="100" height="100" fill="none" stroke="#000000" stroke-width="8" stroke-dasharray="70 20"/>
    </g>
    
    <text x="90" y="32" fill="#FFFFFF" font-size="28" font-weight="800" letter-spacing="2">BAGAN STRUKTUR ORGANISASI</text>
    <text x="90" y="58" fill="#FF5E14" font-size="16" font-weight="700" letter-spacing="3">MAPALA UNIVERSITAS ANDALAS • PERIODE 2024 / 2025</text>
    <text x="1440" y="45" text-anchor="end" fill="#5E6B7D" font-size="14" font-weight="600" letter-spacing="1">SK KEPENGURUSAN NO. 014/MU-UA/2024</text>
  </g>

  <!-- Connector Lines -->
  <!-- Line from Ketua to Tier 2 -->
  <line x1="800" y1="330" x2="800" y2="390" stroke="#FF5E14" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Horizontal Line connecting Sekjen and Bendum -->
  <line x1="570" y1="390" x2="1030" y2="390" stroke="#FF5E14" stroke-width="3"/>
  <line x1="570" y1="390" x2="570" y2="420" stroke="#FF5E14" stroke-width="3"/>
  <line x1="1030" y1="390" x2="1030" y2="420" stroke="#FF5E14" stroke-width="3"/>

  <!-- Line from Tier 2 to Tier 3 -->
  <line x1="800" y1="390" x2="800" y2="590" stroke="#FF5E14" stroke-width="3"/>
  <line x1="200" y1="590" x2="1400" y2="590" stroke="#FF5E14" stroke-width="3"/>
  
  <!-- Vertical Drops to 5 Divisions -->
  <line x1="200" y1="590" x2="200" y2="630" stroke="#FF5E14" stroke-width="3"/>
  <line x1="500" y1="590" x2="500" y2="630" stroke="#FF5E14" stroke-width="3"/>
  <line x1="800" y1="590" x2="800" y2="630" stroke="#FF5E14" stroke-width="3"/>
  <line x1="1100" y1="590" x2="1100" y2="630" stroke="#FF5E14" stroke-width="3"/>
  <line x1="1400" y1="590" x2="1400" y2="630" stroke="#FF5E14" stroke-width="3"/>

  <!-- TIER 1: KETUA UMUM -->
  <g transform="translate(620, 160)" filter="url(#orangeGlow)">
    <rect width="360" height="170" rx="16" fill="url(#ketuaGrad)" stroke="#FF5E14" stroke-width="2"/>
    <!-- Badge -->
    <rect x="105" y="-14" width="150" height="28" rx="14" fill="#FF5E14"/>
    <text x="180" y="5" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="1.5">PIMPINAN UTAMA</text>
    
    <!-- Avatar Circle -->
    <circle cx="180" cy="56" r="30" fill="#1C2433" stroke="#FF5E14" stroke-width="2.5"/>
    <text x="180" y="64" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">RA</text>
    
    <!-- Name & Info -->
    <text x="180" y="112" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">Rizky Alamsyah</text>
    <text x="180" y="132" text-anchor="middle" fill="#FF9D66" font-size="13" font-weight="700" letter-spacing="1">NBP. MU-342/KLA</text>
    <text x="180" y="154" text-anchor="middle" fill="#9DA8B6" font-size="13" font-weight="600">Ketua Umum Periode 2024/2025</text>
  </g>

  <!-- TIER 2: SEKJEN & BENDUM -->
  <!-- Sekretaris Jenderal -->
  <g transform="translate(420, 420)" filter="url(#cardShadow)">
    <rect width="300" height="120" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="26" fill="#18202C" stroke="#4A5568" stroke-width="1.5"/>
    <text x="60" y="67" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">FN</text>
    
    <text x="105" y="48" fill="#FFFFFF" font-size="18" font-weight="800">Fadhil Nurhadi</text>
    <text x="105" y="70" fill="#FF9D66" font-size="12" font-weight="700" letter-spacing="0.5">NBP. MU-351/BLL</text>
    <text x="105" y="94" fill="#9DA8B6" font-size="13" font-weight="600">Sekretaris Jenderal</text>
  </g>

  <!-- Bendahara Umum -->
  <g transform="translate(880, 420)" filter="url(#cardShadow)">
    <rect width="300" height="120" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="26" fill="#18202C" stroke="#4A5568" stroke-width="1.5"/>
    <text x="60" y="67" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">NA</text>
    
    <text x="105" y="48" fill="#FFFFFF" font-size="18" font-weight="800">Nurul Anggraini</text>
    <text x="105" y="70" fill="#FF9D66" font-size="12" font-weight="700" letter-spacing="0.5">NBP. MU-355/BLL</text>
    <text x="105" y="94" fill="#9DA8B6" font-size="13" font-weight="600">Bendahara Umum</text>
  </g>

  <!-- TIER 3: 5 DIVISI OPERASIONAL -->
  <!-- 1. Gunung Hutan -->
  <g transform="translate(75, 630)" filter="url(#cardShadow)">
    <rect width="250" height="160" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <rect x="20" y="20" width="38" height="38" rx="8" fill="rgba(255,94,20,0.15)"/>
    <text x="39" y="45" text-anchor="middle" font-size="20">🏔️</text>
    
    <text x="70" y="45" fill="#FFFFFF" font-size="16" font-weight="800">Gunung Hutan</text>
    <text x="20" y="85" fill="#FF9D66" font-size="14" font-weight="700">Aditya Pratama</text>
    <text x="20" y="103" fill="#5E6B7D" font-size="11" font-weight="600">NBP. MU-360/GH</text>
    <text x="20" y="128" fill="#9DA8B6" font-size="11" line-height="1.4">Eksplorasi rimba, navigasi darat, jungle survival, dan SAR.</text>
  </g>

  <!-- 2. Speleologi -->
  <g transform="translate(375, 630)" filter="url(#cardShadow)">
    <rect width="250" height="160" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <rect x="20" y="20" width="38" height="38" rx="8" fill="rgba(255,94,20,0.15)"/>
    <text x="39" y="45" text-anchor="middle" font-size="20">🔦</text>
    
    <text x="70" y="45" fill="#FFFFFF" font-size="16" font-weight="800">Speleologi</text>
    <text x="20" y="85" fill="#FF9D66" font-size="14" font-weight="700">Rays Mahendra</text>
    <text x="20" y="103" fill="#5E6B7D" font-size="11" font-weight="600">NBP. MU-362/SP</text>
    <text x="20" y="128" fill="#9DA8B6" font-size="11">Susur gua vertikal-horizontal, pemetaan 3D karst, dan biosains.</text>
  </g>

  <!-- 3. Panjat Tebing -->
  <g transform="translate(675, 630)" filter="url(#cardShadow)">
    <rect width="250" height="160" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <rect x="20" y="20" width="38" height="38" rx="8" fill="rgba(255,94,20,0.15)"/>
    <text x="39" y="45" text-anchor="middle" font-size="20">🧗</text>
    
    <text x="70" y="45" fill="#FFFFFF" font-size="16" font-weight="800">Panjat Tebing</text>
    <text x="20" y="85" fill="#FF9D66" font-size="14" font-weight="700">Zikri Rahman</text>
    <text x="20" y="103" fill="#5E6B7D" font-size="11" font-weight="600">NBP. MU-358/RC</text>
    <text x="20" y="128" fill="#9DA8B6" font-size="11">Rock climbing sport & artifisial, perintisan jalur, & evakuasi tebing.</text>
  </g>

  <!-- 4. Arung Jeram & SAR -->
  <g transform="translate(975, 630)" filter="url(#cardShadow)">
    <rect width="250" height="160" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <rect x="20" y="20" width="38" height="38" rx="8" fill="rgba(255,94,20,0.15)"/>
    <text x="39" y="45" text-anchor="middle" font-size="20">🌊</text>
    
    <text x="70" y="45" fill="#FFFFFF" font-size="16" font-weight="800">Arung Jeram & SAR</text>
    <text x="20" y="85" fill="#FF9D66" font-size="14" font-weight="700">Bagus Perkasa</text>
    <text x="20" y="103" fill="#5E6B7D" font-size="11" font-weight="600">NBP. MU-365/WR</text>
    <text x="20" y="128" fill="#9DA8B6" font-size="11">Navigasi sungai arus deras, evakuasi banjir, dan water rescue.</text>
  </g>

  <!-- 5. Konservasi Lingkungan -->
  <g transform="translate(1275, 630)" filter="url(#cardShadow)">
    <rect width="250" height="160" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <rect x="20" y="20" width="38" height="38" rx="8" fill="rgba(255,94,20,0.15)"/>
    <text x="39" y="45" text-anchor="middle" font-size="20">🌿</text>
    
    <text x="70" y="45" fill="#FFFFFF" font-size="16" font-weight="800">Konservasi Alam</text>
    <text x="20" y="85" fill="#FF9D66" font-size="14" font-weight="700">Dina Safitri</text>
    <text x="20" y="103" fill="#5E6B7D" font-size="11" font-weight="600">NBP. MU-368/KL</text>
    <text x="20" y="128" fill="#9DA8B6" font-size="11">Riset keanekaragaman hayati, rehabilitasi DAS, dan advokasi rimba.</text>
  </g>

  <!-- Footer Watermark -->
  <g transform="translate(80, 840)">
    <text x="0" y="20" fill="#5E6B7D" font-size="13" font-weight="600">© 2024 MAPALA UNIVERSITAS ANDALAS. SEMUA HAK DILINDUNGI.</text>
    <text x="1440" y="20" text-anchor="end" fill="#FF5E14" font-size="13" font-weight="600">PKM LANTAI 1 UNAND • LIMAU MANIS, PADANG</text>
  </g>
</svg>
